schema_version: "1.1"
name: mock-interview-from-daf
expected_outcome: |
  A DAF-driven preparation plan (weeks, what to prepare: Telangana and Warangal facts, fintech/payments and governance, why leave a startup for IAS, anthropology big ideas, trekking/chess depth, service and cadre preference justification, 12-month current affairs with opinions), 30+ likely questions grouped by DAF field, model approaches for the hard ones (why leave a well-paid job, IAS vs IPS vs IFS, Telangana-specific issues, fintech regulation/UPI/data privacy), a clear description of how the mock-interview mode works (one question at a time, then feedback), and correct facts about the personality test (275 marks, board of about 5, what is assessed, typical duration), with no invented score numbers.
